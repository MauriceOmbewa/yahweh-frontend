name: yahweh_frontend
description: "Yahweh — A Bible reading social app. Read together. Grow together."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Fonts ──────────────────────────────────────────────
  # Google Fonts gives us Playfair Display (serif, for headings)
  # and Inter (clean sans-serif, for body text).
  google_fonts: ^6.2.1

  # Iconsax is a modern icon pack that matches the clean look
  # of the designs (outlined style icons).
  iconsax: ^0.0.8

  # ── State Management ────────────────────────────────────────
  # Provider is the simplest state management solution in Flutter.
  # It lets screens "listen" to data changes and rebuild when needed.
  provider: ^6.1.2

  # ── Date formatting ──────────────────────────────────────────
  # intl gives us DateFormat for human-readable dates like
  # "Joined March 2026".
  intl: ^0.19.0

  # ── Default Flutter Icons ───────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Networking ───────────────────────────────────────────────
  # http: standard Dart HTTP client for making REST API calls
  http: ^1.2.2

  # ── Persistent Storage ───────────────────────────────────────
  # shared_preferences: stores JWT tokens and user prefs on device
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # We will add font assets here once we download them.
  # For now, google_fonts loads them from the internet.
